<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecture Player</title>
<style>
  :root { --bg:#0e0e10; --panel:#1a1a1d; --fg:#f2f2f7; --muted:#9a9aa0; --accent:#4b8bff; --line:#2e2e33; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }
  header { padding: 10px 16px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  header .muted { color: var(--muted); font-size: 13px; }

  #stage { position: relative; flex: 1; min-height: 0; background: #000; overflow: hidden; user-select: none; }
  #stage video { position: absolute; background: #000; object-fit: contain; transition: all .2s ease; }
  .chip { position: absolute; z-index: 3; font-size: 11px; padding: 2px 7px; border-radius: 10px;
    background: rgba(0,0,0,.6); color: #fff; pointer-events: none; transition: all .2s ease; }

  /* Layout: big + small picture-in-picture */
  #stage.pip .main { inset: 0; width: 100%; height: 100%; z-index: 1; }
  #stage.pip .side { right: 16px; bottom: 16px; width: 24%; aspect-ratio: 16/9; height: auto; z-index: 2;
    border: 2px solid rgba(255,255,255,.35); border-radius: 8px; cursor: pointer; }
  #stage.pip .side:hover { border-color: var(--accent); }
  /* Layout: side by side */
  #stage.split .main { left: 0; top: 0; width: 62%; height: 100%; }
  #stage.split .side { right: 0; top: 0; width: 38%; height: 100%; cursor: pointer; }
  /* Layout: one screen */
  #stage.single .main { inset: 0; width: 100%; height: 100%; }
  #stage.single .side { opacity: 0; pointer-events: none; width: 1px; height: 1px; }

  #toast { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); z-index: 5;
    background: rgba(0,0,0,.75); padding: 6px 14px; border-radius: 16px; font-size: 13px;
    opacity: 0; transition: opacity .3s; pointer-events: none; }
  #toast.show { opacity: 1; }

  #controls { background: var(--panel); padding: 8px 16px 12px; border-top: 1px solid var(--line); }
  #seek { width: 100%; accent-color: var(--accent); margin: 0 0 6px; }
  .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .bar .spacer { flex: 1; }
  button, select { font: inherit; color: var(--fg); background: #26262b; border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  button:hover, select:hover { border-color: var(--accent); }
  button.on { background: var(--accent); border-color: var(--accent); }
  #time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 110px; }
  .speeds { display: flex; gap: 2px; }
  .speeds button { padding: 5px 7px; font-size: 12px; }
  #help { color: var(--muted); font-size: 12px; margin-top: 6px; }
  kbd { background:#2b2b30; border:1px solid var(--line); border-radius:4px; padding:0 4px; font-size:11px; }
  #empty { padding: 40px; color: var(--muted); }
  body.fs header, body.fs #help { display: none; }
</style>
</head>
<body>
<header>
  <h1 id="title" dir="auto"></h1>
  <span class="muted" id="meta" dir="auto"></span>
</header>

<div id="stage" class="pip">
  <div id="toast"></div>
</div>

<div id="controls">
  <input type="range" id="seek" min="0" max="1000" value="0" step="1">
  <div class="bar">
    <button id="play" title="Play / pause (space)">▶︎ Play</button>
    <button id="back" title="Back 10 s (←)">⟲ 10</button>
    <button id="fwd" title="Forward 10 s (→)">10 ⟳</button>
    <span id="time">0:00 / 0:00</span>
    <span class="spacer"></span>
    <span class="speeds" id="speeds"></span>
    <button id="swap" title="Swap big / small (S)">⇄ Swap</button>
    <select id="layout" title="Layout (V)">
      <option value="pip">Big + small</option>
      <option value="split">Side by side</option>
      <option value="single">One screen</option>
    </select>
    <select id="audio" title="Which recording's sound to use"></select>
    <button id="fs" title="Fullscreen (F)">⛶</button>
  </div>
  <div id="help">
    <kbd>Space</kbd> play/pause · <kbd>←</kbd><kbd>→</kbd> 10 s · <kbd>[</kbd><kbd>]</kbd> speed ·
    <kbd>S</kbd> swap screens · <kbd>V</kbd> layout · <kbd>M</kbd> mute · <kbd>F</kbd> fullscreen ·
    click the small video to make it big
  </div>
</div>

<script>
const LECTURE = /*LECTURE_DATA*/null;
</script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const stage = $("stage");
  const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2, 2.25, 2.5, 3];
  const NAMES = { camera: "Camera", screen: "Screen", combined: "Combined" };
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  if (!LECTURE || !LECTURE.videos || !LECTURE.videos.length) {
    stage.innerHTML = '<div id="empty">No recordings found in this folder.</div>';
    return;
  }
  $("title").textContent = LECTURE.title;
  $("meta").textContent = [LECTURE.course, LECTURE.date].filter(Boolean).join(" · ");
  document.title = LECTURE.title;

  // Prefer the separate camera/screen recordings; fall back to the combined file.
  let list = LECTURE.videos.filter((v) => v.kind !== "podcast");
  if (!list.length) list = LECTURE.videos.slice(0, 1);
  list = list.slice(0, 2);

  const players = list.map((v) => {
    const el = document.createElement("video");
    el.src = v.file;
    el.preload = "auto";
    el.playsInline = true;
    el.preservesPitch = true;
    const chip = document.createElement("div");
    chip.className = "chip";
    chip.textContent = NAMES[v.label] || v.label;
    stage.appendChild(el);
    stage.appendChild(chip);
    return { info: v, el, chip, offset: Number(v.offset) || 0 };
  });

  const key = "panopto:" + LECTURE.id;
  const saved = store.get(key, {});
  // Default: screen big, camera small; sound from the camera.
  let mainIdx = saved.main ?? Math.max(0, players.findIndex((p) => p.info.label === "screen"));
  let audioIdx = saved.audio ?? Math.max(0, players.findIndex((p) => p.info.label === "camera"));
  if (mainIdx >= players.length) mainIdx = 0;
  if (audioIdx >= players.length) audioIdx = 0;
  let layout = players.length > 1 ? (saved.layout || "pip") : "single";
  let rate = store.get("panopto:speed", 1);
  let muted = false;

  const master = () => players[audioIdx];
  const followers = () => players.filter((_, i) => i !== audioIdx);

  // ---- Timeline (in lecture time, accounting for each stream's start offset) ----
  const now = () => master().el.currentTime + master().offset;
  const total = () => Math.max(...players.map((p) => (p.el.duration || 0) + p.offset)) || 0;

  function seekTo(t) {
    t = Math.max(0, Math.min(total() || t, t));
    for (const p of players) {
      const local = t - p.offset;
      if (p.el.duration) p.el.currentTime = Math.max(0, Math.min(p.el.duration - 0.05, local));
    }
  }

  function playing() { return !master().el.paused; }

  function play() {
    for (const p of players) p.el.play().catch(() => {});
  }
  function pause() {
    for (const p of players) p.el.pause();
  }
  function toggle() { playing() ? pause() : play(); }

  // Keep the other video locked to the one providing sound.
  function sync() {
    const m = master();
    const t = now();
    for (const f of followers()) {
      const target = t - f.offset;
      const inRange = target >= 0 && (!f.el.duration || target < f.el.duration);
      if (!inRange) { if (!f.el.paused) f.el.pause(); continue; }
      if (m.el.paused) {
        if (!f.el.paused) f.el.pause();
        if (Math.abs(f.el.currentTime - target) > 0.1) f.el.currentTime = target;
        continue;
      }
      if (f.el.paused) f.el.play().catch(() => {});
      const diff = f.el.currentTime - target;
      if (Math.abs(diff) > 0.5) {
        if (!f.el.seeking) f.el.currentTime = target + 0.1; // lead slightly to cover seek time
        f.el.playbackRate = rate;
      } else if (Math.abs(diff) > 0.04) {
        f.el.playbackRate = rate * Math.max(0.8, Math.min(1.2, 1 - diff));
      } else {
        f.el.playbackRate = rate;
      }
    }
  }
  setInterval(sync, 200);

  // ---- UI ----
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove("show"), 1400);
  }

  function fmt(s) {
    s = Math.max(0, Math.floor(s || 0));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = String(s % 60).padStart(2, "0");
    return h ? `${h}:${String(m).padStart(2, "0")}:${sec}` : `${m}:${sec}`;
  }

  function applyLayout() {
    stage.className = layout;
    players.forEach((p, i) => {
      p.el.className = i === mainIdx ? "main" : "side";
      p.chip.style.display = layout === "single" && i !== mainIdx ? "none" : "";
    });
    positionChips();
    $("layout").value = layout;
    $("swap").disabled = $("layout").disabled = players.length < 2;
    persist();
  }

  function positionChips() {
    const box = stage.getBoundingClientRect();
    players.forEach((p) => {
      const r = p.el.getBoundingClientRect();
      p.chip.style.left = (r.left - box.left + 8) + "px";
      p.chip.style.top = (r.top - box.top + 8) + "px";
    });
  }
  window.addEventListener("resize", positionChips);
  stage.addEventListener("transitionend", positionChips);

  function swap() {
    if (players.length < 2) return;
    mainIdx = 1 - mainIdx;
    if (layout === "single") toast((NAMES[players[mainIdx].info.label] || "") + " view");
    applyLayout();
  }

  function setLayout(l) { layout = l; applyLayout(); }

  function applyAudio() {
    players.forEach((p, i) => { p.el.muted = muted || i !== audioIdx; });
    $("audio").value = String(audioIdx);
    persist();
  }

  function setAudio(i) {
    const t = now();
    audioIdx = i;
    applyAudio();
    seekTo(t);
  }

  function setRate(r) {
    rate = Math.round(r * 100) / 100;
    for (const p of players) { p.el.playbackRate = rate; p.el.preservesPitch = true; }
    store.set("panopto:speed", rate);
    document.querySelectorAll("#speeds button").forEach((b) => b.classList.toggle("on", Number(b.dataset.r) === rate));
    toast(rate + "×");
  }

  function stepRate(dir) {
    const next = dir > 0
      ? SPEEDS.find((s) => s > rate + 0.001)
      : [...SPEEDS].reverse().find((s) => s < rate - 0.001);
    if (next) setRate(next);
  }

  function persist() {
    store.set(key, { ...store.get(key, {}), main: mainIdx, audio: audioIdx, layout });
  }

  SPEEDS.forEach((s) => {
    const b = document.createElement("button");
    b.textContent = s + "×";
    b.dataset.r = s;
    b.onclick = () => setRate(s);
    $("speeds").appendChild(b);
  });
  players.forEach((p, i) => {
    const o = document.createElement("option");
    o.value = String(i);
    o.textContent = "Sound: " + (NAMES[p.info.label] || p.info.label);
    $("audio").appendChild(o);
  });
  $("audio").hidden = players.length < 2;

  $("play").onclick = toggle;
  $("back").onclick = () => { seekTo(now() - 10); };
  $("fwd").onclick = () => { seekTo(now() + 10); };
  $("swap").onclick = swap;
  $("layout").onchange = (e) => setLayout(e.target.value);
  $("audio").onchange = (e) => setAudio(Number(e.target.value));
  $("fs").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.body.requestFullscreen();
  document.addEventListener("fullscreenchange", () => {
    document.body.classList.toggle("fs", !!document.fullscreenElement);
    setTimeout(positionChips, 250);
  });

  players.forEach((p, i) => {
    p.el.addEventListener("click", () => {
      if (i !== mainIdx && layout !== "single") swap();
      else toggle();
    });
  });

  const seek = $("seek");
  let dragging = false;
  seek.addEventListener("input", () => {
    dragging = true;
    $("time").textContent = `${fmt(seek.value / 1000 * total())} / ${fmt(total())}`;
  });
  seek.addEventListener("change", () => { seekTo(seek.value / 1000 * total()); dragging = false; });

  function tick() {
    const t = now(), d = total();
    if (!dragging) {
      seek.value = d ? Math.round(t / d * 1000) : 0;
      $("time").textContent = `${fmt(t)} / ${fmt(d)}`;
    }
    $("play").textContent = playing() ? "❚❚ Pause" : "▶︎ Play";
  }
  setInterval(tick, 250);
  players.forEach((p) => {
    p.el.addEventListener("play", tick);
    p.el.addEventListener("pause", tick);
    p.el.addEventListener("loadedmetadata", positionChips);
  });

  // Save position every few seconds.
  setInterval(() => {
    if (playing()) store.set(key, { ...store.get(key, {}), pos: now() });
  }, 3000);
  window.addEventListener("pagehide", () => store.set(key, { ...store.get(key, {}), pos: now() }));

  // If the chosen sound source turns out to be silent, switch to the other recording.
  let audioChecked = saved.audio != null;
  master().el.addEventListener("timeupdate", function check() {
    if (audioChecked || players.length < 2 || now() < 3) return;
    audioChecked = true;
    const m = master().el, other = followers()[0].el;
    if ("webkitAudioDecodedByteCount" in m && m.webkitAudioDecodedByteCount === 0 &&
        other.webkitAudioDecodedByteCount > 0) {
      setAudio(players.indexOf(followers()[0]));
      toast("Using sound from " + (NAMES[players[audioIdx].info.label] || "other recording"));
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "SELECT" || e.metaKey || e.ctrlKey) return;
    const k = e.key;
    if (k === " " || k === "k") { e.preventDefault(); toggle(); }
    else if (k === "ArrowLeft" || k === "j") { e.preventDefault(); seekTo(now() - (e.shiftKey ? 30 : 10)); }
    else if (k === "ArrowRight" || k === "l") { e.preventDefault(); seekTo(now() + (e.shiftKey ? 30 : 10)); }
    else if (k === "[") stepRate(-1);
    else if (k === "]") stepRate(1);
    else if (k === "s" || k === "S") swap();
    else if (k === "v" || k === "V") setLayout({ pip: "split", split: "single", single: "pip" }[layout]);
    else if (k === "m" || k === "M") { muted = !muted; applyAudio(); toast(muted ? "Muted" : "Sound on"); }
    else if (k === "f" || k === "F") $("fs").click();
  });

  // ---- Start ----
  applyLayout();
  applyAudio();
  setRate(rate);
  $("toast").classList.remove("show");
  if (saved.pos > 5) {
    master().el.addEventListener("loadedmetadata", () => {
      // Wait until every video knows its length, then resume.
      const ready = () => players.every((p) => p.el.readyState >= 1);
      const go = () => { seekTo(saved.pos); toast("Resumed at " + fmt(saved.pos)); };
      if (ready()) go(); else players.forEach((p) => p.el.addEventListener("loadedmetadata", () => ready() && go(), { once: true }));
    }, { once: true });
  }
})();
</script>
</body>
</html>
