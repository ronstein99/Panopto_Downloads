<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <h1>Panopto Downloader</h1>
  <div id="status" class="muted">Reading lecture…</div>

  <div id="lecture" hidden>
    <div class="title" id="title"></div>
    <div class="muted" id="meta"></div>

    <h2>Recordings</h2>
    <div id="streams"></div>

    <label class="row" id="podcastRow" hidden>
      <input type="checkbox" id="podcast">
      <span>Also save Panopto's combined MP4 (fixed layout)</span>
    </label>

    <button id="download" class="primary">Download…</button>
  </div>

  <button id="diag" class="link" hidden>Copy diagnostics</button>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
